<div class="container">
    <h1 class="fw-bold">Générer un Voyage Aléatoire</h1>
    <button (click)="genererVoyage()" class="btn btn-primary mb-3">Générer un Voyage</button>
  
    <div class="card p-3" [hidden]="!voyageAleatoire">
      <h2>Détails du Voyage</h2>
      <p><strong>Destination:</strong> {{ voyageAleatoire?.destination }}</p>
      <p><strong>Description:</strong> {{ voyageAleatoire?.description }}</p>
      <p><strong>Prix:</strong> {{ voyageAleatoire?.prix }} €</p>
      <button (click)="validerAjout()" class="btn btn-success">Ajouter à la Liste</button>
    </div>
  </div>
